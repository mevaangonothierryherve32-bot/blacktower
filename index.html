<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Record - Portefeuille</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #1a1a1a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
    }
    canvas {
      max-width: 100%;
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<header>
  <h1>Évolution Mensuelle du Portefeuille</h1>
</header>

<div class="container">
  <h2>Courbe de Performance</h2>
  <canvas id="performanceChart"></canvas>

  <h2>Tableau des Performances</h2>
  <table>
    <tr>
      <th>Mois</th>
      <th>Performance (%)</th>
      <th>Capital</th>
    </tr>
    <tr>
      <td>Janvier 2025</td>
      <td>+4.2%</td>
      <td>105,000€</td>
    </tr>
    <tr>
      <td>Février 2025</td>
      <td>+3.1%</td>
      <td>108,255€</td>
    </tr>
    <tr>
      <td>Mars 2025</td>
      <td>-1.8%</td>
      <td>106,310€</td>
    </tr>
  </table>
</div>

<script>
const ctx = document.getElementById('performanceChart').getContext('2d');
const performanceChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['Janvier 2025', 'Février 2025', 'Mars 2025'],
        datasets: [{
            label: 'Performance (%)',
            data: [4.2, 3.1, -1.8],
            borderColor: 'rgba(75, 192, 192, 1)',
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            fill: true,
            tension: 0.3
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                position: 'top',
            },
        },
        scales: {
            y: {
                beginAtZero: false
            }
        }
    }
});
</script>

</body>
</html>
